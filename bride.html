<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chhavi & Achintya - Wedding Invitation</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Montserrat:wght@300;400;500;600;700&family=Noto+Serif+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100vh;
            height: 100dvh;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #7B1F34;
            overflow: hidden;
            position: relative;
            font-family: 'Montserrat', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Background photo */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('Images/index.jpeg') center/cover no-repeat;
            z-index: 0;
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at center, rgba(123, 31, 52, 0.55) 0%, rgba(92, 14, 36, 0.85) 100%);
            z-index: 0;
        }

        /* Ornamental Border */
        .border-frame {
            position: fixed;
            top: 16px;
            left: 16px;
            right: 16px;
            bottom: 16px;
            border: 2px solid rgba(255, 200, 50, 0.25);
            pointer-events: none;
            z-index: 2;
            border-radius: 8px;
        }

        /* Corner Flowers */
        .corner-flower {
            position: fixed;
            font-size: 2rem;
            pointer-events: none;
            z-index: 3;
            opacity: 0.7;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        .corner-flower--tl { top: 22px; left: 22px; }
        .corner-flower--tr { top: 22px; right: 22px; }
        .corner-flower--bl { bottom: 22px; left: 22px; }
        .corner-flower--br { bottom: 22px; right: 22px; }

        .entry-content {
            text-align: center;
            z-index: 10;
            padding: 40px 30px;
            max-width: 650px;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .emblem-img {
            width: 80px;
            height: auto;
            margin: 0 auto 15px;
            display: block;
            animation: fadeIn 1s ease-out 0.2s both;
            filter: brightness(0) invert(85%) sepia(74%) saturate(648%) hue-rotate(353deg) brightness(98%) contrast(105%);
        }

        .auspicious-symbol {
            font-family: 'Cormorant Garamond', 'Noto Serif Devanagari', serif;
            font-size: 1.3rem;
            font-weight: 600;
            color: #FFD700;
            letter-spacing: 3px;
            margin-bottom: 30px;
            text-shadow: 0 1px 8px rgba(255, 215, 0, 0.3);
            animation: fadeUp 1s ease-out 0.3s both;
        }

        .family-name {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #FFD700;
            margin-bottom: 20px;
            animation: fadeUp 1s ease-out 0.5s both;
        }

        .invite-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.7;
            margin-bottom: 10px;
            animation: fadeUp 1s ease-out 0.7s both;
        }

        .couple-names {
            margin: 15px 0 25px;
            animation: fadeUp 1s ease-out 0.9s both;
        }

        .couple-names h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 5.5rem;
            color: #fff;
            font-weight: 400;
            line-height: 1.15;
            text-shadow: 0 3px 20px rgba(0, 0, 0, 0.3);
        }

        .couple-names h1::first-letter {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 700;
            font-style: normal;
            font-size: 1.15em;
            line-height: 0.9;
            margin-right: 0.04em;
        }

        .couple-names .amp {
            display: block;
            font-family: 'Great Vibes', cursive;
            font-size: 3.5rem;
            color: #FFD700;
            margin: 0;
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
        }

        .event-info {
            margin-bottom: 30px;
            animation: fadeUp 1s ease-out 1.1s both;
        }

        .event-date {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: #fff;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .event-date-line {
            width: 50px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #FFD700, transparent);
            margin: 10px auto;
        }

        .event-venue {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.6);
        }

        .divider {
            color: #FFD700;
            font-size: 1rem;
            letter-spacing: 10px;
            margin: 20px 0;
            opacity: 0.6;
            animation: fadeUp 1s ease-out 1.3s both;
        }

        .enter-btn {
            display: inline-block;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #7B1F34;
            text-decoration: none;
            padding: 16px 50px;
            border: none;
            background: linear-gradient(135deg, #FFD700, #FFC107, #FFB300);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 4px 20px rgba(255, 193, 7, 0.4);
            animation: fadeUp 1s ease-out 1.5s both;
        }

        .enter-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(255, 193, 7, 0.5);
            background: linear-gradient(135deg, #FFE44D, #FFD700, #FFC107);
        }

        .petal {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            animation: petalFall linear infinite;
            opacity: 0;
        }

        @keyframes petalFall {
            0% { transform: translateY(-10vh) rotate(0deg) translateX(0); opacity: 0; }
            10% { opacity: 0.7; }
            50% { transform: translateY(45vh) rotate(180deg) translateX(30px); }
            90% { opacity: 0.5; }
            100% { transform: translateY(110vh) rotate(360deg) translateX(-20px); opacity: 0; }
        }

        .page-transition {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #7B1F34;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
        }

        .page-transition.active {
            opacity: 1;
            pointer-events: all;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .entry-content {
                padding: 20px 20px;
                max-height: 100dvh;
            }

            .emblem-img {
                width: 55px;
                margin-bottom: 8px;
            }

            .auspicious-symbol {
                font-size: 1rem;
                letter-spacing: 2px;
                margin-bottom: 14px;
            }

            .family-name {
                font-size: 0.95rem;
                letter-spacing: 4px;
                margin-bottom: 12px;
            }

            .invite-text {
                font-size: 1rem;
                line-height: 1.5;
                margin-bottom: 4px;
            }

            .couple-names { margin: 8px 0 14px; }
            .couple-names h1 { font-size: 3.4rem; line-height: 1.05; }
            .couple-names .amp { font-size: 2.2rem; }

            .event-info { margin-bottom: 18px; }
            .event-date { font-size: 1.05rem; letter-spacing: 2px; margin-bottom: 6px; }
            .event-date-line { margin: 6px auto; }
            .event-venue { font-size: 0.7rem; letter-spacing: 3px; }

            .divider { margin: 10px 0; font-size: 0.8rem; letter-spacing: 8px; }

            .enter-btn { padding: 13px 36px; font-size: 0.78rem; letter-spacing: 3px; }

            .border-frame { top: 10px; left: 10px; right: 10px; bottom: 10px; }

            .corner-flower { font-size: 1.3rem; }
            .corner-flower--tl { top: 14px; left: 14px; }
            .corner-flower--tr { top: 14px; right: 14px; }
            .corner-flower--bl { bottom: 14px; left: 14px; }
            .corner-flower--br { bottom: 14px; right: 14px; }
        }

        @media (max-width: 380px), (max-height: 720px) {
            .entry-content { padding: 14px 18px; }
            .emblem-img { width: 42px; margin-bottom: 6px; }
            .auspicious-symbol { font-size: 0.85rem; letter-spacing: 1.5px; margin-bottom: 8px; }
            .family-name { font-size: 0.8rem; letter-spacing: 3px; margin-bottom: 8px; }
            .invite-text { font-size: 0.85rem; line-height: 1.4; margin-bottom: 2px; }
            .couple-names { margin: 4px 0 10px; }
            .couple-names h1 { font-size: 2.7rem; }
            .couple-names .amp { font-size: 1.8rem; }
            .event-info { margin-bottom: 10px; }
            .event-date { font-size: 0.9rem; margin-bottom: 4px; }
            .event-date-line { margin: 4px auto; }
            .event-venue { font-size: 0.62rem; letter-spacing: 2px; }
            .divider { margin: 6px 0; font-size: 0.7rem; letter-spacing: 6px; }
            .enter-btn { padding: 11px 30px; font-size: 0.72rem; letter-spacing: 2.5px; }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .entry-content { padding: 8px 16px; }
            .emblem-img { display: none; }
            .auspicious-symbol { font-size: 0.75rem; letter-spacing: 1.5px; margin-bottom: 4px; }
            .family-name { font-size: 0.7rem; letter-spacing: 2px; margin-bottom: 4px; }
            .invite-text { font-size: 0.75rem; line-height: 1.2; margin-bottom: 0; }
            .couple-names { margin: 2px 0 4px; }
            .couple-names h1 { font-size: 1.8rem; line-height: 1; }
            .couple-names .amp { font-size: 1.2rem; }
            .event-info { margin-bottom: 4px; }
            .event-date { font-size: 0.75rem; letter-spacing: 1.5px; margin-bottom: 2px; }
            .event-date-line { margin: 2px auto; height: 1px; }
            .event-venue { font-size: 0.55rem; letter-spacing: 1.5px; }
            .divider { margin: 3px 0; font-size: 0.55rem; letter-spacing: 4px; }
            .enter-btn { padding: 7px 22px; font-size: 0.65rem; letter-spacing: 2px; }
        }
    </style>
</head>
<body>
    <div class="bg-image"></div>
    <div class="bg-overlay"></div>

    <div class="border-frame"></div>
    <div class="corner-flower corner-flower--tl">🌺</div>
    <div class="corner-flower corner-flower--tr">🌸</div>
    <div class="corner-flower corner-flower--bl">🌸</div>
    <div class="corner-flower corner-flower--br">🌺</div>

    <div class="page-transition" id="transition"></div>

    <div class="entry-content">
        <img src="Images/Jain%20Symbol.png" alt="Jain Emblem" class="emblem-img">

        <p class="auspicious-symbol">|| श्री महावीराय नमः ||</p>

        <p class="family-name">Jain Family</p>

        <p class="invite-text">cordially invites you to celebrate the wedding of</p>

        <div class="couple-names">
            <h1>Chhavi</h1>
            <span class="amp">&</span>
            <h1>Achintya</h1>
        </div>

        <div class="event-info">
            <p class="event-date">20 – 21 June 2026</p>
            <div class="event-date-line"></div>
            <p class="event-venue">Royal Orchid Resort, Indore</p>
        </div>

        <div class="divider">✦ ✦ ✦</div>

        <button class="enter-btn" id="enterBtn">Open Invitation</button>
    </div>

    <script>
        var petalEmojis = ['🌸', '🌺', '🌼', '💐', '🪷'];
        function createPetals() {
            var count = window.innerWidth > 768 ? 18 : 10;
            for (var i = 0; i < count; i++) {
                var petal = document.createElement('div');
                petal.className = 'petal';
                petal.textContent = petalEmojis[Math.floor(Math.random() * petalEmojis.length)];
                petal.style.left = Math.random() * 100 + 'vw';
                petal.style.fontSize = (14 + Math.random() * 16) + 'px';
                petal.style.animationDuration = (8 + Math.random() * 12) + 's';
                petal.style.animationDelay = (Math.random() * 12) + 's';
                document.body.appendChild(petal);
            }
        }
        createPetals();

        document.getElementById('enterBtn').addEventListener('click', function () {
            var transition = document.getElementById('transition');
            transition.classList.add('active');
            setTimeout(function () {
                window.location.href = 'invitation-bride.html';
            }, 600);
        });
    </script>
</body>
</html>
