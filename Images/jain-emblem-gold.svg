<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="#FFD700">
  <!-- Cosmic universe outline (Jain loka) -->
  <path d="M 100 15
           L 78 60
           L 30 92
           L 30 152
           L 78 184
           L 100 228
           L 122 184
           L 170 152
           L 170 92
           L 122 60 Z"
        fill="none" stroke="#FFD700" stroke-width="3" stroke-linejoin="round"/>

  <!-- Siddhashila crescent at top -->
  <path d="M 80 42 Q 100 28 120 42 Q 100 36 80 42 Z"/>

  <!-- Three Ratnatraya dots -->
  <circle cx="86" cy="54" r="3.2"/>
  <circle cx="100" cy="52" r="3.2"/>
  <circle cx="114" cy="54" r="3.2"/>

  <!-- Dharma wheel in centre -->
  <g transform="translate(100 130)">
    <circle r="36" fill="none" stroke="#FFD700" stroke-width="2.5"/>
    <circle r="6"/>
    <g stroke="#FFD700" stroke-width="2" stroke-linecap="round">
      <line x1="-32" y1="0" x2="32" y2="0"/>
      <line x1="0" y1="-32" x2="0" y2="32"/>
      <line x1="-22.6" y1="-22.6" x2="22.6" y2="22.6"/>
      <line x1="-22.6" y1="22.6" x2="22.6" y2="-22.6"/>
      <line x1="-12.2" y1="-29.6" x2="12.2" y2="29.6"/>
      <line x1="12.2" y1="-29.6" x2="-12.2" y2="29.6"/>
      <line x1="-29.6" y1="-12.2" x2="29.6" y2="12.2"/>
      <line x1="29.6" y1="-12.2" x2="-29.6" y2="12.2"/>
    </g>
  </g>

  <!-- Ahimsa text -->
  <text x="100" y="210" text-anchor="middle"
        font-family="'Cormorant Garamond', 'Noto Serif Devanagari', serif"
        font-size="16" font-weight="700" letter-spacing="2">अहिंसा</text>
</svg>
